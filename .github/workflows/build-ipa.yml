# Compila el .ipa de Mario Kart World (Switch 2) desde tu dump y lo deja en Google Drive.
#
# Pensado para subirse a un repositorio privado propio, en .github/workflows/.
# Clona siempre https://github.com/cheemu21/plumber-racer-2 (es público, no hace
# falta token) y el dump del juego se baja de Drive, porque pesa 22 GB y no cabe
# en git.
#
# La parte de Drive copia la de nxnative.yml: OAuth con refresh token, alcance
# drive.file, gdown para bajar y googleapiclient para subir. Los nombres de los
# secretos son los mismos, para poder reutilizar los valores.
#
# Secretos:
#
#   NXNATIVE_GDRIVE_OAUTH_CLIENT_ID       id de cliente OAuth
#   NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET   secreto del cliente
#   NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN   refresh token
#   NXNATIVE_GDRIVE_ROM_FOLDER            enlace (o id) de la carpeta con el dump
#   NXNATIVE_GDRIVE_FOLDER_ID             id de la carpeta de destino
#
# Aviso sobre el alcance: `drive.file` solo da acceso a lo que ha creado esta
# app. gdown baja igual si los archivos están compartidos por enlace; si tu dump
# es privado de verdad, cambia el alcance a /auth/drive y vuelve a generar el
# refresh token.

name: Compilar IPA de Mario Kart World

on:
  workflow_dispatch:
    inputs:
      romfs:
        description: 'romfs: separate = .ipa pequeño + RomFS.img aparte; bundle = todo dentro del .ipa'
        type: choice
        options: [separate, bundle]
        default: separate
      app_name:
        description: 'Nombre en la pantalla de inicio (vacío = el del juego)'
        required: false
      keep_romfs:
        description: 'Subir también el RomFS.img (22 GB) a Drive'
        type: boolean
        default: true

# Un build a la vez: dos a la vez se pelean por la cuota de Drive y por la caché.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    # Necesita macOS con Apple silicon. macos-26 trae un Xcode más nuevo que los
    # runners anteriores; el paso 2 comprueba que sea el 27.2 que pide el proyecto.
    runs-on: macos-26
    timeout-minutes: 350

    steps:
      - name: Comprobar el entorno (Xcode, disco, herramientas)
        run: |
          set -euo pipefail
          echo "=== macOS ==="
          sw_vers
          echo "=== Xcode instalados ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "ninguno en /Applications"
          echo "=== espacio en disco ==="
          df -h /

          libre_gb=$(df -k / | awk 'NR==2 {print int($4 / 1048576)}')
          echo "Libre: ${libre_gb} GB"
          if [ "${libre_gb}" -lt 60 ]; then
              echo "::error::Este runner tiene ${libre_gb} GB libres y el build necesita unos 60 (22 del dump + 27 del build + margen). Usa un runner mayor (macos-26-xlarge o self-hosted) o sube el disco del runner."
              exit 1
          fi

      - name: Seleccionar Xcode
        run: |
          set -euo pipefail
          # Los runners de GitHub no traen el 27.2. Si está, se usa; si no, el que
          # haya, y los shaders se compilan con --allow-other-metal (más abajo),
          # que es la vía que usa nxnative.yml en macos-15.
          if [ -d /Applications/Xcode-27.2.app ]; then
              app=/Applications/Xcode-27.2.app
          elif [ -d /Applications/Xcode_27.2.app ]; then
              app=/Applications/Xcode_27.2.app
          elif [ -d /Applications/Xcode.app ]; then
              app=/Applications/Xcode.app
              echo "::warning::Sin Xcode 27.2 en el runner: se compila con el Metal del que hay."
          else
              app=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -1 || true)
              echo "::warning::Sin Xcode.app; se usa ${app}"
          fi

          if [ -z "${app:-}" ] || [ ! -d "${app}" ]; then
              echo "::error::No hay ningún Xcode en el runner."
              ls -d /Applications/Xcode*.app 2>/dev/null || echo "  ninguno"
              exit 1
          fi

          echo "Usando: ${app}"
          sudo xcode-select -s "${app}"
          xcodebuild -version

      - name: Traer el compilador de Metal
        run: |
          # Componente aparte desde Xcode 26; sin él falla el paso de shaders.
          xcodebuild -downloadComponent MetalToolchain || echo "::warning::MetalToolchain no se pudo descargar; si el build falla en los shaders, es esto."

      - name: Clonar plumber-racer-2
        run: |
          set -euo pipefail
          # Repo público: se clona sin credenciales ni secretos.
          git clone --depth 1 https://github.com/cheemu21/plumber-racer-2.git src
          cd src && git log --oneline -1

      - name: Comprobar que están los secretos de Drive
        env:
          CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          REFRESH: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
          ROM_FOLDER: ${{ secrets.NXNATIVE_GDRIVE_ROM_FOLDER }}
          OUT_FOLDER: ${{ secrets.NXNATIVE_GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          for nombre in CLIENT_ID CLIENT_SECRET REFRESH ROM_FOLDER OUT_FOLDER; do
              if [ -z "${!nombre:-}" ]; then
                  echo "::error::Falta el secreto ${nombre}"
                  exit 1
              fi
          done
          echo "Secretos presentes"

      - name: Preparar Python y herramientas del build
        run: |
          set -euo pipefail
          cd src
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk || echo "::warning::dotnet-sdk ya presente o el cask falló"
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic \
              "backports.zstd; python_version < '3.14'" gdown google-api-python-client
          python3 --version
          python3 -c "import lz4, capstone, fontTools, gdown, googleapiclient; print('deps ok')"

      - name: Comprobar el acceso de escritura a Drive
        env:
          CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          REFRESH: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.NXNATIVE_GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          cd src
          . .venv/bin/activate
          python3 - <<'PY'
          import io
          import os

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseUpload

          credenciales = Credentials(
              None,
              refresh_token=os.environ["REFRESH"].strip(),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["CLIENT_ID"].strip(),
              client_secret=os.environ["CLIENT_SECRET"].strip(),
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )
          servicio = build("drive", "v3", credentials=credenciales)
          carpeta = os.environ["FOLDER_ID"].strip()

          prueba = servicio.files().create(
              body={"name": ".mkw_permiso.tmp", "parents": [carpeta]},
              media_body=MediaIoBaseUpload(io.BytesIO(b"ok"), mimetype="text/plain"),
              fields="id",
          ).execute()
          servicio.files().delete(fileId=prueba["id"]).execute()
          print("Drive: escritura verificada")
          PY

      - name: Restaurar la caché de shaders
        env:
          CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          REFRESH: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.NXNATIVE_GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p work
          cd src
          . .venv/bin/activate

          ARCHIVO=/tmp/mkw-shaders.tar.zst
          rm -f "${ARCHIVO}"

          python3 - <<'PY'
          import os
          import time

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          credenciales = Credentials(
              None,
              refresh_token=os.environ["REFRESH"].strip(),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["CLIENT_ID"].strip(),
              client_secret=os.environ["CLIENT_SECRET"].strip(),
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )
          servicio = build("drive", "v3", credentials=credenciales)
          carpeta = os.environ["FOLDER_ID"].strip()

          encontrados = servicio.files().list(
              q=f"name = 'mkw-shaders.tar.zst' and '{carpeta}' in parents and trashed = false",
              fields="files(id, size)",
              orderBy="modifiedTime desc",
          ).execute().get("files", [])

          if not encontrados:
              print("no hay caché de shaders guardada; el build los compilará")
              raise SystemExit(0)

          fichero = encontrados[0]
          peso = int(fichero.get("size", 0))
          print(f"bajando la caché ({peso / 2**30:.2f} GiB)")

          peticion = servicio.files().get_media(fileId=fichero["id"])
          with open("/tmp/mkw-shaders.tar.zst", "wb") as salida:
              descarga = MediaIoBaseDownload(salida, peticion, chunksize=64 * 1024 * 1024)
              termina = False
              ultimo = 0
              while not termina:
                  estado, termina = descarga.next_chunk()
                  if estado and estado.resumable_progress - ultimo >= 512 * 1024 * 1024:
                      print(f"  {estado.resumable_progress / 2**30:.1f} GiB")
                      ultimo = estado.resumable_progress
          print("caché descargada")
          PY

          if [ -s "${ARCHIVO}" ]; then
              zstd -dc "${ARCHIVO}" | tar -xf - -C "$GITHUB_WORKSPACE/work"
              rm -f "${ARCHIVO}"
              echo "=== caché restaurada ==="
              du -sh "$GITHUB_WORKSPACE"/work/* 2>/dev/null | head -10
              find "$GITHUB_WORKSPACE/work" -maxdepth 4 -name 'b-*.key' -o -maxdepth 4 -name '*.metallib' | head -5
          fi

      - name: Bajar el zip desde Drive
        env:
          ROM_FOLDER: ${{ secrets.NXNATIVE_GDRIVE_ROM_FOLDER }}
        run: |
          set -euo pipefail
          cd src
          . .venv/bin/activate
          cd "$GITHUB_WORKSPACE"
          rm -rf descarga game_input
          mkdir -p descarga

          # Acepta el enlace de carpeta, el de archivo o el id a pelo.
          entrada="$(printf '%s' "${ROM_FOLDER}" | tr -d '[:space:]')"
          es_carpeta=false
          if [[ "${entrada}" =~ /folders/([A-Za-z0-9_-]+) ]]; then
              id="${BASH_REMATCH[1]}"; es_carpeta=true
          elif [[ "${entrada}" =~ /d/([A-Za-z0-9_-]+) ]]; then
              id="${BASH_REMATCH[1]}"
          elif [[ "${entrada}" =~ [?\&]id=([A-Za-z0-9_-]+) ]]; then
              id="${BASH_REMATCH[1]}"
          else
              id="${entrada}"; es_carpeta=true
          fi

          if [ "${es_carpeta}" = true ]; then
              echo "Bajando la carpeta ${id}…"
              # --remaining-ok: sin esto gdown corta a los 50 archivos.
              python3 -m gdown --folder "https://drive.google.com/drive/folders/${id}" \
                  -O descarga/ --remaining-ok
          else
              echo "Bajando el archivo ${id}…"
              python3 -m gdown "https://drive.google.com/uc?id=${id}" -O descarga/
          fi

          echo "=== descargado ==="
          du -sh descarga
          find descarga -maxdepth 2 | head -20
          df -h /

      - name: Extraer el zip y borrarlo
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p game_input

          # Extrae todos los .zip que haya y los borra en cuanto salen, para no
          # tener a la vez el zip y su contenido (22 GB cada uno).
          encontrado=false
          while IFS= read -r zip; do
              encontrado=true
              echo "Extrayendo ${zip}…"
              unzip -q -o "${zip}" -d descarga/extraido
              rm -f "${zip}"
              echo "  borrado ${zip}"
          done < <(find descarga -maxdepth 3 -iname '*.zip')

          if [ "${encontrado}" = false ]; then
              echo "::warning::No hay ningún .zip en la descarga; se usa lo que haya."
              mkdir -p descarga/extraido
              cp -a descarga/. descarga/extraido/ 2>/dev/null || true
          fi

          # Búsqueda recursiva de la carpeta "base" del dump. Se comprueba que
          # tenga exefs/main.npdm dentro para no confundirla con otra "base".
          base=""
          while IFS= read -r candidata; do
              if [ -f "${candidata}/exefs/main.npdm" ]; then
                  base="${candidata}"
                  break
              fi
          done < <(find descarga/extraido -type d -name base -print)

          if [ -z "${base}" ]; then
              echo "::error::No encuentro ninguna carpeta 'base' con exefs/main.npdm dentro. Esto hay dentro de la extracción:"
              find descarga/extraido -maxdepth 4 | head -60
              exit 1
          fi

          origen=$(dirname "${base}")
          echo "Dump encontrado en: ${origen}"

          # base/ (y updates/ o dlc/ si los hubiera) pasa a game_input/, que es
          # lo que el script espera: base/ como hijo directo.
          shopt -s dotglob nullglob
          mv "${origen}"/* game_input/ 2>/dev/null || true
          shopt -u dotglob nullglob

          # Lo que quede de la descarga: zip ya borrados, extracción ya movida.
          rm -rf descarga

          if [ ! -f game_input/base/exefs/main.npdm ]; then
              echo "::error::Tras mover, game_input/base/exefs/main.npdm no existe. Contenido:"
              find game_input -maxdepth 3 | head -40
              exit 1
          fi

          echo "=== dump listo ==="
          du -sh game_input game_input/base/* 2>/dev/null
          find game_input -maxdepth 2 | head -30
          df -h /

      - name: Compilar el .ipa
        env:
          ROMFS: ${{ inputs.romfs }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          cd src
          . .venv/bin/activate

          argumentos=(
              --platform ios
              --romfs "${ROMFS}"
              # Carpeta fija: ahí vive shader/, profile/ y extract/, que es lo que
              # se guarda entre ejecuciones en Drive.
              --work-dir "$GITHUB_WORKSPACE/work"
              # Compila los shaders con el Metal que tenga el runner. Sin esto,
              # Xcode distinto de 27.2 aborta el paso de shaders.
              --allow-other-metal
          )
          [ -n "${APP_NAME:-}" ] && argumentos+=(--app-name "${APP_NAME}")

          # El dump va como carpeta; prod.keys no hace falta para un dump.
          python3 scripts/build_ipa_from_nsp.py "$GITHUB_WORKSPACE/game_input" "${argumentos[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo "=== resultados ==="
          find "$GITHUB_WORKSPACE/games" "$GITHUB_WORKSPACE/game_input" -name '*.ipa' -o -name 'RomFS.img' 2>/dev/null | sort

      - name: Guardar la caché de shaders
        if: always()
        env:
          CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          REFRESH: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.NXNATIVE_GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # El .key lo escribe el build solo cuando los shaders han salido bien.
          # Sin él, la caché a medias no sirve y no se sube.
          clave=$(find work/shader/ios -maxdepth 1 -name 'b-*.key' 2>/dev/null | head -1 || true)
          if [ -z "${clave}" ]; then
              echo "::warning::Sin .key de shaders (build fallido o incompleto); no guardo caché."
              exit 0
          fi
          echo "clave: ${clave}"

          ARCHIVO=/tmp/mkw-shaders.tar.zst
          rm -f "${ARCHIVO}"

          # Se guarda lo justo para que la próxima vez se reutilice: las librerías
          # iOS con su .key, la tabla que es entrada de los shaders y el profile.
          # shader/cache/ se queda fuera: es la parte gorda y no hace falta.
          partes=(shader/ios)
          [ -f work/shader/pso_pairs.tsv ] && partes+=(shader/pso_pairs.tsv)
          [ -d work/profile ] && partes+=(profile)

          echo "empaquetando: ${partes[*]}"
          tar -cf - -C work "${partes[@]}" | zstd -19 -T0 -o "${ARCHIVO}"
          echo "paquete: $(du -h "${ARCHIVO}" | cut -f1)"

          cd src
          . .venv/bin/activate
          export MKW_CACHE="${ARCHIVO}"

          python3 - <<'PY'
          import os
          import time
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credenciales = Credentials(
              None,
              refresh_token=os.environ["REFRESH"].strip(),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["CLIENT_ID"].strip(),
              client_secret=os.environ["CLIENT_SECRET"].strip(),
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )
          servicio = build("drive", "v3", credentials=credenciales)
          carpeta = os.environ["FOLDER_ID"].strip()
          ruta = Path(os.environ["MKW_CACHE"])

          # Una sola copia: se borra la anterior antes de subir la nueva.
          for viejo in servicio.files().list(
              q=f"name = 'mkw-shaders.tar.zst' and '{carpeta}' in parents and trashed = false",
              fields="files(id)",
          ).execute().get("files", []):
              servicio.files().delete(fileId=viejo["id"]).execute()
              print(f"borrada la caché anterior ({viejo['id']})")

          media = MediaFileUpload(
              str(ruta), mimetype="application/octet-stream", resumable=True,
              chunksize=64 * 1024 * 1024)
          peticion = servicio.files().create(
              body={"name": "mkw-shaders.tar.zst", "parents": [carpeta]},
              media_body=media, fields="id,webViewLink")

          respuesta = None
          intentos = 0
          ultimo = 0
          tam = ruta.stat().st_size
          while respuesta is None:
              try:
                  estado, respuesta = peticion.next_chunk()
              except Exception as error:
                  intentos += 1
                  if intentos > 6:
                      raise
                  print(f"  reintento {intentos} tras {error!r}")
                  time.sleep(2 ** intentos)
                  continue
              if estado and estado.resumable_progress - ultimo >= 256 * 1024 * 1024:
                  print(f"  subido {estado.resumable_progress / 2**30:.1f} GiB de {tam / 2**30:.1f}")
                  ultimo = estado.resumable_progress
          print("caché subida:", respuesta.get("id", ""))
          PY

          rm -f "${ARCHIVO}"

      - name: Borrar el dump crudo extraído
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # base/ ya ha cumplido: el RomFS.img preparado está en el build folder
          # (<id>_build/extract/v<N>/RomFS.img). Se borra el dump entero para
          # liberar los 22 GB antes de mover la salida.
          antes=$(df -k . | awk 'NR==2 {print int($4 / 1048576)}')
          rm -rf game_input/base
          despues=$(df -k . | awk 'NR==2 {print int($4 / 1048576)}')
          echo "Dump crudo borrado: ${antes} GB libres → ${despues} GB"
          echo "=== lo que queda ==="
          du -sh game_input/* 2>/dev/null | head
          find game_input -maxdepth 4 -name 'RomFS.img' -o -maxdepth 4 -name '*.ipa' | head

      - name: Reunir lo generado
        run: |
          set -euo pipefail
          mkdir -p salida
          ipa=$(find . -maxdepth 6 -name '*.ipa' 2>/dev/null | sort | tail -1)
          if [ -z "${ipa}" ]; then
              echo "::error::El build terminó sin .ipa. Mira las últimas líneas de build.log."
              tail -40 build.log
              exit 1
          fi
          cp -f "${ipa}" salida/
          echo "IPA: $(du -h salida/*.ipa | tail -1)"

          if [ "${{ inputs.keep_romfs }}" = "true" ]; then
              # El RomFS.img preparado, no la rom cruda (esa ya no existe).
              romfs=$(find work game_input -name 'RomFS.img' -size +1G 2>/dev/null | sort | tail -1 || true)
              if [ -n "${romfs}" ]; then
                  echo "RomFS: $(du -h "${romfs}" | cut -f1)"
                  versiona=$(basename "$(dirname "${romfs}")")
                  mkdir -p "salida/romfs/${versiona}"
                  cp -f "${romfs}" "salida/romfs/${versiona}/RomFS.img"
              else
                  echo "::warning::No hay RomFS.img (con --romfs bundle va dentro del .ipa)."
              fi
          fi

          echo "=== salida ==="
          du -sh salida/* 2>/dev/null | head

      - name: Subir el resultado a Drive
        env:
          CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          REFRESH: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
          FOLDER_ID: ${{ secrets.NXNATIVE_GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          cd src
          . .venv/bin/activate

          ipa=$(find "$GITHUB_WORKSPACE/salida" -maxdepth 1 -name '*.ipa' | head -1)
          if [ -z "${ipa}" ] || [ ! -s "${ipa}" ]; then
              echo "::error::No hay .ipa en salida/"
              exit 1
          fi
          romfs=$(find "$GITHUB_WORKSPACE/salida/romfs" -name 'RomFS.img' 2>/dev/null | head -1 || true)

          export MKW_IPA="${ipa}"
          export MKW_ROMFS="${romfs}"

          python3 - <<'PY'
          import os
          import time
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credenciales = Credentials(
              None,
              refresh_token=os.environ["REFRESH"].strip(),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["CLIENT_ID"].strip(),
              client_secret=os.environ["CLIENT_SECRET"].strip(),
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )
          servicio = build("drive", "v3", credentials=credenciales)
          carpeta = os.environ["FOLDER_ID"].strip()
          fecha = time.strftime("%Y-%m-%d_%H%M", time.gmtime())
          run = os.environ.get("GITHUB_RUN_NUMBER", "0")

          # El RomFS son 22 GB: subida por trozos, con reintentos y progreso.
          def subir(ruta: Path, destino: str) -> str:
              tam = ruta.stat().st_size
              media = MediaFileUpload(
                  str(ruta),
                  mimetype="application/octet-stream",
                  resumable=True,
                  chunksize=64 * 1024 * 1024,
              )
              peticion = servicio.files().create(
                  body={"name": ruta.name, "parents": [destino]},
                  media_body=media,
                  fields="id,webViewLink",
              )
              respuesta = None
              intentos = 0
              ultimo = 0
              while respuesta is None:
                  try:
                      estado, respuesta = peticion.next_chunk()
                  except Exception as error:
                      intentos += 1
                      if intentos > 6:
                          raise
                      print(f"  reintento {intentos} tras {error!r}")
                      time.sleep(2 ** intentos)
                      continue
                  if estado:
                      enviado = estado.resumable_progress
                      if enviado - ultimo >= 512 * 1024 * 1024 or enviado >= tam:
                          print(f"  {enviado / tam * 100:5.1f} %  ({enviado / 2**30:.1f} GiB de {tam / 2**30:.1f})")
                          ultimo = enviado
              return respuesta.get("id", "")

          def carpeta_destino(nombre: str) -> str:
              existe = servicio.files().list(
                  q=f"name = '{nombre}' and '{carpeta}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false",
                  fields="files(id)",
                  supportsAllDrives=True,
              ).execute()
              if existe.get("files"):
                  return existe["files"][0]["id"]
              creada = servicio.files().create(
                  body={
                      "name": nombre,
                      "mimeType": "application/vnd.google-apps.folder",
                      "parents": [carpeta],
                  },
                  fields="id",
              ).execute()
              return creada["id"]

          destino = carpeta_destino(f"mkw-ipa-{fecha}-{run}")
          print(f"Subiendo a la carpeta de Drive {destino}")

          ipa = Path(os.environ["MKW_IPA"])
          print(f"IPA: {ipa.name} ({ipa.stat().st_size / 2**20:.0f} MiB)")
          print(f"  id: {subir(ipa, destino)}")

          romfs = os.environ.get("MKW_ROMFS", "").strip()
          if romfs and Path(romfs).exists():
              ruta = Path(romfs)
              print(f"RomFS: {ruta.name} ({ruta.stat().st_size / 2**30:.1f} GiB)")
              print(f"  id: {subir(ruta, destino)}")
          PY

      - name: Guardar el .ipa también como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.run_number }}
          path: salida/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Guardar el registro del build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

# ---------------------------------------------------------------------------
# Notas para quien mantenga esto
#
# 1. Xcode. El proyecto pide Xcode 27.2 y macOS 26.6 (README y TUTORIAL). El paso
#    "Seleccionar el Xcode más nuevo" falla a propósito si el que encuentra es
#    más viejo, porque compilar los 11.561 shaders con un Metal anterior deja el
#    paso a medias. Salidas: runner propio con el 27.2, o --allow-other-metal
#    (como en nxnative.yml), sabiendo que el propio proyecto avisa de corrupción
#    con otro compilador (issue #242).
#
# 2. Disco. El dump son 22 GB y el build otros 27 GB. El primer paso aborta si
#    hay menos de 60 GB libres. Si el runner no llega, antes de cambiar de
#    máquina se puede liberar espacio como en nxnative.yml (Android SDK, cachés,
#    CoreSimulator, dotnet).
#
# 3. Tiempo. Primer build: 30-60 min de compilación más 20-30 min de shaders.
#    El job tiene 350 min de margen y la caché de shaders no se guarda entre
#    ejecuciones: cada run paga ese tiempo otra vez.
#
# 4. RomFS.img. Con --romfs separate el .ipa pesa ~690 MB y los archivos del
#    juego van en un RomFS.img de ~21,7 GB. Por eso se sube a Drive y no como
#    artefacto (GitHub corta en 10 GB). El .ipa sí va como artefacto, por si
#    Drive falla.
#
# 5. Subida. La de nxnative.yml hace create().execute() de una vez, que sirve
#    para 690 MB pero no aguanta un corte de red a los 15 GB. Aquí va por trozos
#    de 64 MiB con reintentos y progreso.
#
# 6. Nada del juego viaja en git: el dump entra y sale por Drive, y el workspace
#    del runner se destruye al terminar.
