name: Build nxnative IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build nxnative Game for iOS
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Clone nxnative (upstream)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/seedds/nxnative.git nxnative

      - name: Patch upstream DmGamepad compilation bug
        shell: bash
        run: |
          set -euo pipefail
          echo "Patching DmGamepad.m compilation error..."
          sed -i '' 's/.*deviceMotionBody.*/\/\/ &/g' nxnative/dm/ios/Sources/DmGamepad.m || true

      - name: Check required secrets
        shell: bash
        env:
          NXNATIVE_PROD_KEYS_URL: ${{ secrets.NXNATIVE_PROD_KEYS_URL }}
          NXNATIVE_BASE_NSP_URL: ${{ secrets.NXNATIVE_BASE_NSP_URL }}
          NXNATIVE_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
          NXNATIVE_GDRIVE_FOLDER_ID: ${{ secrets.NXNATIVE_GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail

          for name in \
            NXNATIVE_PROD_KEYS_URL \
            NXNATIVE_BASE_NSP_URL \
            NXNATIVE_GDRIVE_OAUTH_CLIENT_ID \
            NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET \
            NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN \
            NXNATIVE_GDRIVE_FOLDER_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Install build tools & dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

          python3 -m venv "$RUNNER_TEMP/nxnative-python"
          "$RUNNER_TEMP/nxnative-python/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nxnative-python/bin/python" -m pip install \
            lz4 \
            capstone \
            fonttools \
            "backports.zstd; python_version < '3.14'" \
            gdown \
            google-api-python-client

      - name: Validate build tools & Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking CLI tool binaries..."
          xcodegen --version
          zstd --version
          spirv-cross --help > /dev/null || true
          dotnet --version

          echo "Checking Python dependencies..."
          "$RUNNER_TEMP/nxnative-python/bin/python" -c "
          import lz4, capstone, fontTools, gdown, googleapiclient
          print('✓ All Python dependencies loaded successfully.')
          "

      - name: Verify Google Drive access & upload permissions
        shell: bash
        env:
          NXNATIVE_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
          NXNATIVE_GDRIVE_FOLDER_ID: ${{ secrets.NXNATIVE_GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/nxnative-python/bin/python" - <<'PY'
          import os
          import io
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseUpload

          client_id = os.environ.get("NXNATIVE_GDRIVE_OAUTH_CLIENT_ID", "").strip()
          client_secret = os.environ.get("NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET", "").strip()
          refresh_token = os.environ.get("NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN", "").strip()
          folder_id = os.environ.get("NXNATIVE_GDRIVE_FOLDER_ID", "").strip()

          credentials = Credentials(
              None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )

          service = build("drive", "v3", credentials=credentials)

          print(f"Testing write access to Google Drive folder ID: {folder_id}...")
          dummy_metadata = {"name": ".nxnative_perm_test.tmp", "parents": [folder_id]}
          dummy_media = MediaIoBaseUpload(io.BytesIO(b"ok"), mimetype="text/plain")

          test_file = service.files().create(
              body=dummy_metadata,
              media_body=dummy_media,
              fields="id"
          ).execute()

          test_id = test_file.get("id")
          service.files().delete(fileId=test_id).execute()
          print("✓ Google Drive write access verified successfully!")
          PY

      - name: Download private game assets from Google Drive
        shell: bash
        env:
          NXNATIVE_PROD_KEYS_URL: ${{ secrets.NXNATIVE_PROD_KEYS_URL }}
          NXNATIVE_BASE_NSP_URL: ${{ secrets.NXNATIVE_BASE_NSP_URL }}
          NXNATIVE_UPDATE_NSP_URL: ${{ secrets.NXNATIVE_UPDATE_NSP_URL }}
          NXNATIVE_DLC_NSP_URL: ${{ secrets.NXNATIVE_DLC_NSP_URL }}
          NXNATIVE_DLC_FOLDER_ID: ${{ secrets.NXNATIVE_DLC_FOLDER_ID }}
          NXNATIVE_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p game_input

          normalize_gdrive_input() {
            local input="$1"
            local id=""

            if [[ "$input" =~ ^https?://drive\.google\.com/file/d/([^/]+) ]]; then
              id="${BASH_REMATCH[1]}"
            elif [[ "$input" =~ ^https?://drive\.google\.com/open\?id=([^&]+) ]]; then
              id="${BASH_REMATCH[1]}"
            elif [[ "$input" =~ ^https?://drive\.google\.com/uc\?id=([^&]+) ]]; then
              id="${BASH_REMATCH[1]}"
            elif [[ "$input" =~ ^https?:// && "$input" =~ [\?\&]id=([^&]+) ]]; then
              id="${BASH_REMATCH[1]}"
            fi

            if [[ -n "$id" ]]; then
              printf 'https://drive.google.com/uc?id=%s\n' "$id"
            else
              printf '%s\n' "$input"
            fi
          }

          download_asset() {
            local url="$1"
            local output="$2"

            echo "Downloading $output..."
            source="$(normalize_gdrive_input "$url")"
            "$RUNNER_TEMP/nxnative-python/bin/python" -m gdown "$source" -O "$output"

            if [[ ! -s "$output" ]]; then
              echo "Downloaded file is empty: $output"
              exit 1
            fi
          }

          download_asset "$NXNATIVE_PROD_KEYS_URL" game_input/prod.keys
          download_asset "$NXNATIVE_BASE_NSP_URL" game_input/base.nsp

          if [[ -n "${NXNATIVE_UPDATE_NSP_URL:-}" ]]; then
            download_asset "$NXNATIVE_UPDATE_NSP_URL" game_input/update.nsp
          fi

          if [[ -n "${NXNATIVE_DLC_NSP_URL:-}" ]]; then
            download_asset "$NXNATIVE_DLC_NSP_URL" game_input/dlc.nsp
          fi

          if [[ -n "${NXNATIVE_DLC_FOLDER_ID:-}" ]]; then
            echo "Downloading DLC files from Google Drive folder ID: $NXNATIVE_DLC_FOLDER_ID..."
            "$RUNNER_TEMP/nxnative-python/bin/python" - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          client_id = os.environ.get("NXNATIVE_GDRIVE_OAUTH_CLIENT_ID", "").strip()
          client_secret = os.environ.get("NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET", "").strip()
          refresh_token = os.environ.get("NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN", "").strip()
          dlc_folder_id = os.environ.get("NXNATIVE_DLC_FOLDER_ID", "").strip()

          credentials = Credentials(
              None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/drive.file", "https://www.googleapis.com/auth/drive.readonly"],
          )

          service = build("drive", "v3", credentials=credentials)
          results = service.files().list(
              q=f"'{dlc_folder_id}' in parents and trashed = false",
              fields="files(id, name)"
          ).execute()

          items = results.get("files", [])
          print(f"Found {len(items)} DLC file(s) in folder.")
          for item in items:
              file_id = item["id"]
              file_name = item["name"]
              print(f"Downloading DLC: {file_name}...")
              request = service.files().get_media(fileId=file_id)
              target_path = os.path.join("game_input", file_name)
              with open(target_path, "wb") as f:
                  downloader = MediaIoBaseDownload(f, request)
                  done = False
                  while not done:
                      status, done = downloader.next_chunk()
          PY
          fi

          chmod 600 game_input/prod.keys
          ls -lh game_input/

      - name: Build IPA with nxnative
        shell: bash
        env:
          ALLOW_OTHER_METAL: "True"
        run: |
          set -euo pipefail
          mkdir -p output_ipa

          cd nxnative
          "$RUNNER_TEMP/nxnative-python/bin/python" scripts/build_ipa_from_nsp.py \
            ../game_input \
            -k ../game_input/prod.keys \
            -o ../output_ipa/game.ipa \
            --allow-other-metal

          ls -lh ../output_ipa/

      - name: Upload IPA to Google Drive
        shell: bash
        env:
          NXNATIVE_GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_ID }}
          NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET }}
          NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN }}
          NXNATIVE_GDRIVE_FOLDER_ID: ${{ secrets.NXNATIVE_GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail

          IPA_FILE=$(find output_ipa -maxdepth 1 -name "*.ipa" | head -n 1)

          if [[ -z "$IPA_FILE" || ! -s "$IPA_FILE" ]]; then
            echo "No .ipa file was generated in output_ipa/"
            exit 1
          fi

          export NXNATIVE_IPA_PATH="$IPA_FILE"

          "$RUNNER_TEMP/nxnative-python/bin/python" - <<'PY'
          import os
          from pathlib import Path

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          client_id = os.environ.get("NXNATIVE_GDRIVE_OAUTH_CLIENT_ID", "").strip()
          client_secret = os.environ.get("NXNATIVE_GDRIVE_OAUTH_CLIENT_SECRET", "").strip()
          refresh_token = os.environ.get("NXNATIVE_GDRIVE_OAUTH_REFRESH_TOKEN", "").strip()
          folder_id = os.environ.get("NXNATIVE_GDRIVE_FOLDER_ID", "").strip()

          ipa_path = Path(os.environ["NXNATIVE_IPA_PATH"])
          if not ipa_path.exists() or ipa_path.stat().st_size == 0:
              raise RuntimeError(f"IPA missing or empty: {ipa_path}")

          credentials = Credentials(
              None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/drive.file"],
          )

          service = build("drive", "v3", credentials=credentials)
          metadata = {"name": ipa_path.name, "parents": [folder_id]}
          media = MediaFileUpload(str(ipa_path), mimetype="application/octet-stream", resumable=True)

          print(f"Uploading {ipa_path.name} to Google Drive folder {folder_id}...")
          uploaded = service.files().create(
              body=metadata,
              media_body=media,
              fields="id,webViewLink",
          ).execute()

          file_id = uploaded.get("id", "")
          web_view_link = uploaded.get("webViewLink", "")
          print(f"Uploaded IPA to Google Drive. File ID: {file_id}")
          if web_view_link:
              print(f"Web view link: {web_view_link}")
          PY
