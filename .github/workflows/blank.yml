name: Build Mush8 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build Mush8 for iOS
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Clone Mush8
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/c22dev/mush8.git mush8

      - name: Check required asset URLs
        shell: bash
        env:
          MUSH8_PROD_KEYS_URL: ${{ secrets.MUSH8_PROD_KEYS_URL }}
          MUSH8_BASE_NSP_URL: ${{ secrets.MUSH8_BASE_NSP_URL }}
          MUSH8_UPDATE_NSP_URL: ${{ secrets.MUSH8_UPDATE_NSP_URL }}
        run: |
          set -euo pipefail

          for name in \
            MUSH8_PROD_KEYS_URL \
            MUSH8_BASE_NSP_URL \
            MUSH8_UPDATE_NSP_URL
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

          xcodebuild -version
          xcodegen version
          rustc +1.98.1 --version

      - name: Download private game assets
        shell: bash
        env:
          MUSH8_PROD_KEYS_URL: ${{ secrets.MUSH8_PROD_KEYS_URL }}
          MUSH8_BASE_NSP_URL: ${{ secrets.MUSH8_BASE_NSP_URL }}
          MUSH8_UPDATE_NSP_URL: ${{ secrets.MUSH8_UPDATE_NSP_URL }}
        run: |
          set -euo pipefail
          cd mush8

          download_asset() {
            local url="$1"
            local output="$2"

            echo "Downloading $output..."

            if [[ "$url" =~ ^https?:// ]]; then
              python3 -m gdown --fuzzy "$url" -O "$output"
            else
              python3 -m gdown "$url" -O "$output"
            fi

            if [[ ! -s "$output" ]]; then
              echo "Downloaded file is empty: $output"
              exit 1
            fi
          }

          download_asset "$MUSH8_PROD_KEYS_URL" prod.keys
          download_asset "$MUSH8_BASE_NSP_URL" base.nsp
          download_asset "$MUSH8_UPDATE_NSP_URL" upd4-0-1.nsp

          chmod 600 prod.keys

          for file in prod.keys base.nsp upd4-0-1.nsp; do
            if [[ ! -f "$file" ]]; then
              echo "Required asset missing: $file"
              exit 1
            fi

            if [[ ! -s "$file" ]]; then
              echo "Required asset is empty: $file"
              exit 1
            fi

            echo "$file downloaded successfully:"
            ls -lh "$file"
          done

      - name: Build IPA
        working-directory: mush8
        shell: bash
        env:
          BUNDLE_ID: com.imcoguu.mush8
        run: |
          set -euo pipefail
          ./make-ios.sh --ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-ipa
          path: mush8/build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7
