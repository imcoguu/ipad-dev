name: Compilar IPA de kid-with-sword-remake

on:
  workflow_dispatch:
    inputs:
      romfs:
        description: "Empaquetado de los archivos del juego"
        type: choice
        options: [bundle, separate]
        default: bundle
      app_name:
        description: "Nombre de la app (opcional)"
        required: false
        type: string
      xcode_app:
        description: "Ruta del Xcode a usar (vacío = el más nuevo instalado)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build unsigned iOS IPA
    # Imagen con Xcode 27 (preview, macOS 27 de base): es la única que trae el
    # Metal 4 que el proyecto necesita. Con macos-26 el build muere en
    # MTL4FXTemporalScaler. Si hace falta más disco, xcode-27-xlarge.
    runs-on: xcode-27
    timeout-minutes: 350

    steps:
      - name: Checkout del repositorio del workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Elegir el Xcode que sepa compilar el proyecto
        env:
          XCODE_PEDIDO: ${{ inputs.xcode_app }}
        run: |
          set -euo pipefail

          # El proyecto usa la API Metal 4 de MetalFX. Con un SDK que no declara
          # esas propiedades, xcodebuild falla con «property colorContentOffsetX
          # not found on object of type MTL4FXTemporalScaler», un error que aparece
          # 74 segundos después y no dice qué hacer.
          #
          # Aquí se comprueba en el SDK de cada Xcode, en segundos, y se elige el
          # primero que la soporte. Xcode-27-2.app va primero; si no está, se
          # prueban los demás de más nuevo a más viejo.
          PROPIEDAD="colorContentOffsetX"

          candidatos=()
          if [ -n "${XCODE_PEDIDO:-}" ]; then
              candidatos+=("${XCODE_PEDIDO}")
          fi
          for preferido in /Applications/Xcode-27-2.app /Applications/Xcode_27.2.app; do
              [ -d "$preferido" ] && candidatos+=("$preferido")
          done
          while IFS= read -r app; do
              [ -d "$app" ] && candidatos+=("$app")
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -Vr)

          if [ ${#candidatos[@]} -eq 0 ]; then
              echo "::error::No hay ningún Xcode instalado en el runner"
              exit 1
          fi

          elegido=""
          probados=""
          for app in "${candidatos[@]}"; do
              sudo xcode-select -s "$app" 2>/dev/null || continue
              version=$(xcodebuild -version 2>/dev/null | awk '/^Xcode/ {print $2}')
              sdk=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
              probados="${probados}\n  ${app} (Xcode ${version:-?})"

              if [ -n "$sdk" ] && grep -rqs "$PROPIEDAD" \
                  "$sdk/System/Library/Frameworks/MetalFX.framework/Headers" \
                  "$sdk/System/Library/Frameworks/Metal.framework/Headers" 2>/dev/null; then
                  elegido="$app"
                  echo "Elegido: ${app} (Xcode ${version}) — su SDK declara ${PROPIEDAD}"
                  break
              fi
              echo "descartado: ${app} (Xcode ${version:-?}) — su SDK no declara ${PROPIEDAD}"
          done

          if [ -z "$elegido" ]; then
              echo -e "::error::Ningún Xcode del runner sabe compilar Metal 4 de MetalFX. Probados:${probados}"
              exit 1
          fi

          sudo xcode-select -s "$elegido"
          echo "XCODE_ELEGIDO=${elegido}" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "--- Metal ---"
          xcrun metal --version || true
          echo "--- SDK de iPhone ---"
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Liberar espacio en disco
        run: |
          set -euo pipefail
          echo "--- antes ---"; df -h /

          # El build necesita, a la vez: el .nup (25 GB), lo que extrae de él
          # (25 GB) y el IPA empaquetado (otros ~20 GB). El runner no trae eso
          # de serie, así que se quita lo que este trabajo no usa.
          for app in /Applications/Xcode*.app; do
              [ "$app" = "${XCODE_ELEGIDO:-}" ] && continue
              sudo rm -rf "$app" && echo "fuera: $app"
          done
          rm -rf ~/Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          rm -rf ~/Library/Caches/* ~/.nuget/packages 2>/dev/null || true
          sudo rm -rf /usr/local/share/dotnet/sdk/*/FSharp 2>/dev/null || true
          rm -rf /Users/runner/hostedtoolcache/CodeQL 2>/dev/null || true

          echo "--- después ---"; df -h /
          libre=$(df -g / | awk 'NR==2 {print $4}')
          echo "libre: ${libre} GB"
          if [ "${libre}" -lt 70 ]; then
              echo "::warning::Solo ${libre} GB libres: el build necesita unos 70"
          fi

      - name: Instalar Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Clonar kid-with-sword-remake
        run: git clone --depth 1 https://github.com/cheemu21/kid-with-sword-remake.git src

      - name: Instalar herramientas del proyecto
        working-directory: src
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang
          if ! command -v dotnet >/dev/null 2>&1; then
            brew install --cask dotnet-sdk
          fi
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic \
            "backports.zstd; python_version < '3.14'" gdown google-api-python-client

      - name: Bajar el .nup desde Drive
        env:
          NUP_URL: ${{ secrets.KID_GDRIVE_NUP_URL }}
        run: |
          set -euo pipefail
          cd src
          . .venv/bin/activate
          cd "$GITHUB_WORKSPACE"

          if [ -z "${NUP_URL:-}" ]; then
              echo "::error::Falta el secreto KID_GDRIVE_NUP_URL con el enlace del .nup"
              exit 1
          fi

          rm -rf game_input
          mkdir -p game_input

          # Directo a la carpeta del juego: bajarlo a otra parte y copiarlo
          # costaba 50 GB en disco y el runner se quedaba sin espacio.
          entrada="$(printf '%s' "${NUP_URL}" | tr -d '[:space:]')"
          es_carpeta=false
          if [[ "${entrada}" =~ /folders/([A-Za-z0-9_-]+) ]]; then
              id="${BASH_REMATCH[1]}"; es_carpeta=true
          elif [[ "${entrada}" =~ /d/([A-Za-z0-9_-]+) ]]; then
              id="${BASH_REMATCH[1]}"
          elif [[ "${entrada}" =~ [?\&]id=([A-Za-z0-9_-]+) ]]; then
              id="${BASH_REMATCH[1]}"
          else
              id="${entrada}"
          fi

          if [ "${es_carpeta}" = true ]; then
              python3 -m gdown --folder "https://drive.google.com/drive/folders/${id}" -O game_input/ --remaining-ok
          else
              python3 -m gdown "https://drive.google.com/uc?id=${id}" -O game_input/
          fi

          ls -lh game_input; du -sh game_input; df -h /
          compgen -G "$GITHUB_WORKSPACE/game_input/*.nup" > /dev/null || {
              echo "::error::No hay ningún .nup en game_input"; exit 1; }

      - name: Comprobar archivos del juego
        run: |
          set -euo pipefail
          compgen -G "$GITHUB_WORKSPACE/game_input/*.nup" > /dev/null || {
              echo "::error::Falta el .nup en game_input"; exit 1; }
          ls -lh "$GITHUB_WORKSPACE"/game_input/*.nup
          df -h /

      - name: Compilar IPA
        working-directory: src
        env:
          ROMFS: ${{ inputs.romfs }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          . .venv/bin/activate
          args=(--platform ios --romfs "$ROMFS")
          if [ -n "${APP_NAME:-}" ]; then
            args+=(--app-name "$APP_NAME")
          fi
          # El .nup y lo extraído no caben juntos. En cuanto aparece el RomFS
          # extraído, el .nup sobra: se borra y se recuperan 25 GB. El borrado
          # no rompe nada aunque el tool aún lo tenga abierto (el fichero sigue
          # vivo hasta que lo cierre), así que no hay carrera.
          (
            while ! compgen -G "$GITHUB_WORKSPACE/game_input/*_build/extract/v*/RomFS.img" > /dev/null; do
                sleep 15
            done
            sleep 20
            rm -f "$GITHUB_WORKSPACE"/game_input/*.nup && echo "== .nup borrado tras la extracción =="
            df -h /
          ) &

          python scripts/build_ipa_from_nsp.py "$GITHUB_WORKSPACE/game_input" "${args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Reunir IPA
        run: |
          set -euo pipefail
          mkdir -p salida
          ipa=$(find "$GITHUB_WORKSPACE/game_input" -type f -name '*.ipa' | sort | tail -1)
          if [ -z "$ipa" ]; then
            echo "::error::La compilación terminó sin generar un IPA"
            tail -80 build.log || true
            exit 1
          fi
          ls -lh "$ipa"; df -h /
          cp "$ipa" salida/
          ls -lh salida/

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: kid-with-sword-remake-ipa-${{ github.run_number }}
          path: salida/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Subir log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kid-with-sword-remake-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
